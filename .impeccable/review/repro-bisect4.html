<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="minimal.css">
</head>
<body>
<h3>Test A: ul.nav-tabs with 1 li</h3>
<header class="directory-header">
  <div class="directory-header-inner">
    <span>Cohort</span>
    <nav><ul class="nav-tabs"><li><a class="nav-tab">Events</a></li></ul></nav>
  </div>
</header>

<h3>Test B: ul display flex NOWRAP, 4 li</h3>
<header class="directory-header">
  <div class="directory-header-inner">
    <span>Cohort</span>
    <nav><ul class="nav-tabs" style="flex-wrap: nowrap;">
      <li><a class="nav-tab">Events</a></li>
      <li><a class="nav-tab">Host</a></li>
      <li><a class="nav-tab">Profile</a></li>
      <li><a class="nav-tab">Log in</a></li>
    </ul></nav>
  </div>
</header>

<h3>Test C: plain ul (no display:flex at all), 4 li</h3>
<header class="directory-header">
  <div class="directory-header-inner">
    <span>Cohort</span>
    <nav><ul style="list-style:none;margin:0;padding:0;">
      <li style="display:inline-block"><a class="nav-tab">Events</a></li>
      <li style="display:inline-block"><a class="nav-tab">Host</a></li>
      <li style="display:inline-block"><a class="nav-tab">Profile</a></li>
      <li style="display:inline-block"><a class="nav-tab">Log in</a></li>
    </ul></nav>
  </div>
</header>
</body>
</html>
